<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRAND HOME - Введення даних</title>
  <link rel="stylesheet" href="../css/email_page.css">
  <link rel="stylesheet" href="../css/depth.css?v=4">
</head>
<body>

  <img src="../img/leaf.png" alt="" class="bg-leaf leaf-1">
  <img src="../img/leaf.png" alt="" class="bg-leaf leaf-2">
  <img src="../img/leaf.png" alt="" class="bg-leaf leaf-3">
  <img src="../img/leaf.png" alt="" class="bg-leaf leaf-4">
  <img src="../img/leaf.png" alt="" class="bg-leaf leaf-5">
  <img src="../img/leaf.png" alt="" class="bg-leaf leaf-6">
  <img src="../img/leaf.png" alt="" class="bg-leaf leaf-7">
  <img src="../img/leaf.png" alt="" class="bg-leaf leaf-8">

  <a href="login_options.html" class="back-btn" aria-label="Назад">
    <svg class="back-btn__icon" viewBox="0 0 36 62" preserveAspectRatio="none" aria-hidden="true">
      <path d="M30.375 5.625 L5.625 31 L30.375 56.375" fill="none" stroke="currentColor" stroke-width="11.25" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>

  <main class="page-container">
    <div class="modal-card modal-card-login">

      <div class="card-dots">
        <span class="active"></span>
        <span class="active"></span>
        <span class="active"></span>
      </div>

      <h1 class="login-title">LOG IN</h1>

      <p class="login-subtitle email-subtitle">Welcome back, любий мешканцю!</p>

      <form class="login-form" id="loginForm" novalidate>
        <div class="form-group">
          <label for="username" class="form-label">Нік або електронна адреса</label>
          <input type="text" id="username" name="username" class="form-input" required autocomplete="username" aria-describedby="username-error">
          <span class="field-error" id="username-error" role="alert"></span>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Пароль</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" class="form-input form-input--password" required autocomplete="current-password" aria-describedby="password-error">
            <button type="button" class="pw-toggle" id="pwToggle" aria-label="Показати пароль" aria-pressed="false">
              <svg class="pw-toggle__eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="3"/>
                <path class="pw-toggle__slash" d="M4 4l16 16"/>
              </svg>
            </button>
          </div>
          <span class="field-error" id="password-error" role="alert"></span>
        </div>

        <div class="forgot-password-wrapper">
          <a href="#" class="forgot-password">Забули пароль?</a>
        </div>

         <button type="submit" class="btn btn-full">Увійти</button>
      </form>

    </div>
  </main>

  <script src="../js/email_page.js"></script>
</body>
</html>
